name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "*.md"
      - "*.sh"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  version:
    name: Get OpenList Version Information
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.generate.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version Name
        id: generate
        run: |
          BASE_VERSION=$(cat openlist_version)
          TIMESTAMP=$(date +%y%m%d%H)
          VERSION_NAME="${BASE_VERSION}.${TIMESTAMP}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Download OpenList Source Code
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          chmod +x *.sh
          ./init_openlist.sh

  libs:
    name: Build OpenList Libraries
    uses: ./.github/workflows/build_openlist.yaml

  android:
    name: Build OpenList Android APK
    needs: [version, libs]
    runs-on: ubuntu-latest
    env:
      # 注意这里：Debug 包的输出路径跟 Release 不同
      debug_output: "${{ github.workspace }}/build/app/outputs/flutter-apk"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download OpenList Android AAR
        uses: actions/download-artifact@v4
        with:
          name: openlist-android-aar
          path: ${{ github.workspace }}/android/app/libs/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      - name: Build Debug APK
        env:
          BUILD_VERSION_NAME: ${{ needs.version.outputs.version_name }}
        # 打包 Debug 版本，自带系统签名，绝对能装
        run: flutter build apk --debug --split-per-abi

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "OpenList-Mobile-${{ needs.version.outputs.version_name }}_arm64_debug"
          # 挑出带有 arm64-v8a 的 Debug 包上传
          path: "${{ env.debug_output }}/*arm64-v8a*.apk"
